name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="$HOME/Projetos/Clientes/18-Santiago_Producoes/01.Sistema_Shows_Rafael_Aragao"
            cd "$APP_DIR"
            git remote prune origin || true
            git fetch origin +main:refs/remotes/origin/main
            git reset --hard origin/main
            sed -i 's/\r$//' backend/entrypoint.sh || true
            chmod +x backend/entrypoint.sh || true
            if [ ! -f deploy/.env ]; then
              echo "ERRO: deploy/.env não existe no servidor."
              exit 1
            fi
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
            # Recria o nginx para re-resolver IPs dos containers novos (evita 502).
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --force-recreate --no-deps proxy
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env ps
            for i in $(seq 1 30); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:9026/ || true)
              echo "health $i: $code"
              if [ "$code" = "200" ]; then
                exit 0
              fi
              sleep 2
            done
            echo "ERRO: proxy não respondeu 200 após o deploy."
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --tail=80 proxy frontend backend
            exit 1
