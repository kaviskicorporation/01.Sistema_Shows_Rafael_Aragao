services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aragao}
      POSTGRES_USER: ${POSTGRES_USER:-aragao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aragao} -d ${POSTGRES_DB:-aragao}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      AUTH_COOKIE_SECURE: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-aragao}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aragao}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://aragao.kaviskicorporation.com.br}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-aragao.kaviskicorporation.com.br,localhost,127.0.0.1,backend}
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  imap:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      AUTH_COOKIE_SECURE: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-aragao}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aragao}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://aragao.kaviskicorporation.com.br}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-aragao.kaviskicorporation.com.br,localhost,127.0.0.1,backend}
    command: python manage.py listen_imap
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - internal

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:9026:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media:/var/www/media:ro
      - staticfiles:/var/www/static:ro
    depends_on:
      - frontend
      - backend
    networks:
      - internal

volumes:
  pgdata:
  media:
  staticfiles:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.90.26.0/24
          gateway: 10.90.26.1
